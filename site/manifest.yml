# Public / private manifest for the website (single source of truth for what may be published).
#
# DENY BY DEFAULT: the site build reads only the files matched in `public`. Everything else in the
# repository (answer keys, lesson plans, teacher guides, reference solutions, tests, the self-check
# script, assessments) is private and is never opened by the converter. tools/site/check_private.py
# then scans the finished site and fails the build if any private file name, marker string or
# distinctive line from a private source shows up in the output.
#
# {dir} is the level folder, e.g. grade-4-6/1-introductory.
#
# Levels are named by their key in curriculum.json; `dir` must match it (the build checks), so this file
# says exactly which folders may be read. Pages go to <band>/level-N/ on the site, e.g. grade-2-3/level-1/.

levels:
  # Grades 2-3 (Kids Coding Junior)
  - {key: j1, dir: grade-2-3/1-little-robots,     published: true}
  - {key: j2, dir: grade-2-3/2-game-makers,       published: true}
  - {key: j3, dir: grade-2-3/3-bridge-to-python,  published: true}
  # Grades 4-6
  - {key: "1", dir: grade-4-6/1-introductory,     published: true}
  - {key: "2", dir: grade-4-6/2-intermediate,     published: true}
  - {key: "3", dir: grade-4-6/3-advanced,         published: true}

public:
  workbook: "{dir}/teaching-material/workbook/week[0-9][0-9].tex"
  homework: "{dir}/teaching-material/homework/week[0-9][0-9].tex"
  exercise_dirs: "{dir}/exercises/week[0-9][0-9]/*/"
  # Only these files are read from an exercise folder (README, starter, hints, starter data).
  exercise_files: [README.md, starter.py, hints.md, "*.csv", words.txt]
  project_brief: "{dir}/project/project-brief.tex"
  project_starter_dir: "{dir}/project/starter"
  # Student-facing extras (never certificates or teacher material).
  cheat_sheet: "{dir}/teaching-material/extras/cheat-sheet.tex"
  glossary: "{dir}/teaching-material/extras/glossary.tex"
  parent_notes: "{dir}/teaching-material/extras/parent-notes.tex"
  progress_tracker: "{dir}/teaching-material/extras/progress-tracker.tex"
  # Track syllabi: week titles, big ideas, goals and project summaries are shown on the level pages.
  syllabi: [grade-2-3/SYLLABUS.md, grade-4-6/SYLLABUS.md]
  # New public guides written for the website (Mac setup, troubleshooting).
  resources: "resources/*.md"
  install_script: "resources/install-mac.sh"   # shown on the Mac setup page and offered as a download
  # PDFs that may be offered for download (matched on the file stem of the built PDF).
  download_stems: [student-workbook, homework, cheat-sheet, glossary, parent-notes, progress-tracker, project-brief]
  parents:
    deck: parents/build/parent-deck.pdf
    handout: parents/build/parent-handout.pdf
    source: parents/main.tex
    shared: parents/content/shared.tex
    faq: parents/content/faq.tex          # extra FAQ entries for parents/faq/ (not in the deck)
    bib: parents/references.bib

private:
  # Path fragments that must never appear in a published file name or link.
  paths:
    - answers/
    - answer-key
    - lesson-plans
    - /lessons/
    - teacher-guide
    - project-teacher-guide
    - solution
    - test_
    - check_my_work
    - /reference/
    - assessments
    - certificate
    - smoke_inputs
    - speaker-notes
    - parent-deck-notes
  # File names that look private by pattern but are student starter templates and are published on purpose.
  allow_files:
    - test_my_project.py
    - my_tests.py
  # Marker strings that must never appear in published text.
  strings:
    - TEACHER ONLY
    - Teacher script
    - Answer key
    - answer key
    - solution.py
    - Reference solution
  # Sources whose distinctive lines must not appear anywhere in the output (fingerprint check).
  fingerprint_sources:
    - "{dir}/exercises/week*/*/solution.py"
    - "{dir}/exercises/week*/*/solution.md"
    - "{dir}/project/reference/**/*.py"
    - "{dir}/teaching-material/answers/*.tex"
    - "{dir}/teaching-material/answer-key.tex"
    - "{dir}/teaching-material/lessons/*.tex"
    - "{dir}/teaching-material/assessments.tex"
    - "{dir}/project/project-teacher-guide.tex"
    - "{dir}/teaching-material/extras/certificate.tex"
